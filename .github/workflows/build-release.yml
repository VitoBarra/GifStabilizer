name: Build And Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_name: GifStabilizer-windows-x64
            artifact_name: gifstabilizer-windows-x64
          - os: ubuntu-latest
            archive_name: GifStabilizer-linux-x64
            artifact_name: gifstabilizer-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1 python

      - name: Build Linux executables
        if: runner.os == 'Linux'
        run: chmod +x ./scripts/build_linux.sh && ./scripts/build_linux.sh python

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\GifStabilizer-GUI.exe,dist\GifStabilizer-CLI.exe -DestinationPath ("release\${{ matrix.archive_name }}.zip")

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf "release/${{ matrix.archive_name }}.tar.gz" -C dist GifStabilizer-GUI GifStabilizer-CLI

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
